name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Match your local dev version
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for Linting errors
      run: npm run lint # Requires "lint": "eslint ." in package.json

    - name: Build project (Webpack Check)
      run: npm run build # Ensures the project actually compiles

    - name: Run Unit Tests
      run: npm test # Ensures the chess logic still works
